services:

  # ── Frontend: Next.js + Stagehand scraping ──────────────────────────────────
  - type: web
    name: aria-frontend
    runtime: node
    rootDir: frontend
    # Install deps + Chromium browser (for Playwright/Stagehand LOCAL mode — FREE, no Browserbase needed)
    buildCommand: npm install && npx playwright install chromium --with-deps && npm run build
    startCommand: npm run start
    plan: starter           # $7/mo — no cold starts, always-on
    healthCheckPath: /
    envVars:
      # LOCAL mode — uses Playwright on Render's Linux server (FREE, no Browserbase)
      - key: STAGEHAND_ENV
        value: LOCAL

      # OpenAI — Stagehand uses this for AI extraction
      - key: OPENAI_API_KEY
        sync: false

      # Backend URL — set after backend deploys
      - key: NEXT_PUBLIC_API_URL
        sync: false         # https://aria-backend.onrender.com
      - key: BACKEND_PROXY_URL
        sync: false         # https://aria-backend.onrender.com

  # ── Backend: FastAPI + ARIA agent ──────────────────────────────────────────
  - type: web
    name: aria-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter           # $7/mo — no cold starts, always-on
    healthCheckPath: /health
    envVars:
      # OpenAI — ARIA agent uses this
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        value: gpt-4o-mini

      # Database (Supabase)
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false

      # Frontend URL — backend calls Next.js Stagehand routes
      # Set this to aria-frontend.onrender.com after frontend deploys
      - key: FRONTEND_URL
        sync: false         # https://aria-frontend.onrender.com

      # Web Search
      - key: TAVILY_API_KEY
        sync: false
      - key: APIFY_API_KEY
        sync: false

      # ARIA config
      - key: USE_ARIA_AGENT
        value: "true"
      - key: ARIA_MAX_TOOL_ROUNDS
        value: "10"
